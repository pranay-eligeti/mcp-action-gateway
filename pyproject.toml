[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-action-gateway"
version = "0.1.0"
description = "A safe, typed MCP action gateway portfolio project"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src"]
